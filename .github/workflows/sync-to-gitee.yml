name: Sync to Gitee

# 触发条件：push 到 main 分支，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于同步所有分支和tag

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config --global user.name "ai-yukin"
          git config --global user.email "ai-yukin@users.noreply.github.com"

          # 添加 Gitee 远程仓库（使用令牌认证）
          git remote add gitee "https://ai-yukin:${GITEE_TOKEN}@gitee.com/ai-yukin/dsh-0-tools.git"

          # 推送 main 分支
          echo "=== 推送 main 分支 ==="
          git push gitee main:main --force

          # 推送 master 分支（Gitee 默认分支是 master，保持同步）
          echo "=== 推送 master 分支 ==="
          git push gitee main:master --force

          # 推送所有 tag
          echo "=== 推送所有 tags ==="
          git push gitee --tags --force

          echo "=== 同步完成 ==="
