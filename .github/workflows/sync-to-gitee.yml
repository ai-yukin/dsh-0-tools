name: Sync to Gitee

# 触发条件：push 到 main 分支，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于同步所有分支和tag

      - name: Sync to Gitee (with retry)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN 未配置！请在 GitHub Settings → Secrets and variables → Actions 中添加 GITEE_TOKEN"
            exit 1
          fi

          git config --global user.name "ai-yukin"
          git config --global user.email "ai-yukin@users.noreply.github.com"

          # 添加 Gitee 远程仓库
          git remote add gitee "https://ai-yukin:${GITEE_TOKEN}@gitee.com/ai-yukin/dsh-0-tools.git"

          # 带重试的推送函数（最多3次，每次间隔10秒）
          push_with_retry() {
            local desc="$1"
            local args="$2"
            local max_attempts=3
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "=== [尝试 $attempt/$max_attempts] $desc ==="
              if git push gitee $args; then
                echo "✅ $desc 成功"
                return 0
              else
                echo "⚠️  $desc 失败（尝试 $attempt/$max_attempts）"
                if [ $attempt -lt $max_attempts ]; then
                  echo "等待10秒后重试..."
                  sleep 10
                fi
                attempt=$((attempt + 1))
              fi
            done
            echo "::error::$desc 在 $max_attempts 次尝试后仍然失败"
            return 1
          }

          # 推送 main 分支（force 覆盖，确保历史一致）
          push_with_retry "推送 main 分支" "main:main --force" || exit 1

          # v1.10.0 起不再推送 master。
          # 背景：Gitee 建仓时默认分支名为 master，而本仓库主线一直是 main，
          # 于是长期靠force push main:master 维持首页展示，属于历史遗留的兼容负担
          # —— 读者在首页看到的 README 可能落后于 main，历史上就因此误判过版本。
          #
          # 已完成的整改（2026-10-07，经 Gitee API 核实生效）：
          #   1. Gitee 仓库default_branch 由 master 改为 main
          #   2.远端 master 分支已删除，Gitee 现仅有 main 一个分支
          # 因此本工作流只同步 main + tags。
          #
          # 若日后Gitee 侧被重置、默认分支又被改回 master，
          # 重新执行一次整改即可（不需要改本文件）：
          #   curl -X PATCH https://gitee.com/api/v5/repos/<owner>/<repo> \
          #     -H "Content-Type: application/json" \
          #     -d '{"name":"<repo>","default_branch":"main"}' -u <user>:<token>
          #   git push gitee --delete master

          # 推送所有 tag
          push_with_retry "推送所有 tags" "--tags --force" || exit 1

          echo ""
          echo "========================================"
          echo "  ✅ Gitee 同步全部完成！"
          echo "  仓库地址: https://gitee.com/ai-yukin/dsh-0-tools"
          echo "========================================"
